name: llm-router-mcp

on:
  push:
    paths: ["projects/llm-router-mcp/**", ".github/workflows/llm-router-mcp.yml"]
  pull_request:
    paths: ["projects/llm-router-mcp/**", ".github/workflows/llm-router-mcp.yml"]

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: projects/llm-router-mcp
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements-dev.txt
      - run: ruff check .
      - run: pytest -v
